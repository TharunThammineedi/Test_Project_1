image: mcr.microsoft.com/playwright:v1.62.1-jammy

definitions:
  caches:
    npm: ~/.npm

  steps:
    - step: &pw-test
        size: 2x
        max-time: 120
        caches:
          - npm
        artifacts:
          - playwright-report/**
          - test-results/**
          - allure-results/**

# Manual only (Pipelines → Run pipeline). No branches/default = not on push.
pipelines:
  custom:
    rfp:
      - step:
          <<: *pw-test
          name: Run RFP
          script:
            - export CI=true PLAYWRIGHT_NO_COPY_PROMPT=1 HEADLESS=true
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - npx playwright test regression/rfp --project=chromium --workers=4

    estimates:
      - step:
          <<: *pw-test
          name: Run Estimates
          script:
            - export CI=true PLAYWRIGHT_NO_COPY_PROMPT=1 HEADLESS=true
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - npx playwright test regression/estimates --project=chromium --workers=4

    product-item:
      - step:
          <<: *pw-test
          name: Run Product Item
          script:
            - export CI=true PLAYWRIGHT_NO_COPY_PROMPT=1 HEADLESS=true
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - npx playwright test regression/product-item --project=chromium --workers=4

    opportunity:
      - step:
          <<: *pw-test
          name: Run Opportunity
          script:
            - export CI=true PLAYWRIGHT_NO_COPY_PROMPT=1 HEADLESS=true
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - npx playwright test regression/opportunity --project=chromium --workers=4

    customer:
      - step:
          <<: *pw-test
          name: Run Customer
          script:
            - export CI=true PLAYWRIGHT_NO_COPY_PROMPT=1 HEADLESS=true
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - npx playwright test regression/customer --project=chromium --workers=4

    mainflow:
      - step:
          <<: *pw-test
          name: Run Main Flow
          script:
            - export CI=true PLAYWRIGHT_NO_COPY_PROMPT=1 HEADLESS=true
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - npx playwright test regression --project=chromium --grep '@mainflow' --workers=1

    regression:
      - step:
          <<: *pw-test
          name: Run All Modules
          script:
            - export CI=true PLAYWRIGHT_NO_COPY_PROMPT=1 HEADLESS=true
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - npx playwright test regression --project=chromium --workers=4
