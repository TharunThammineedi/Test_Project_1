image: mcr.microsoft.com/playwright:v1.62.1-jammy

definitions:
  caches:
    npm: ~/.npm

  steps:
    - step: &rfp-test
        size: 2x
        max-time: 120
        caches:
          - npm
        artifacts:
          - playwright-report/**
          - test-results/**
          - allure-results/**
          - blob-report/**

    - step: &estimates-test
        size: 2x
        max-time: 120
        caches:
          - npm
        artifacts:
          - playwright-report/**
          - test-results/**
          - allure-results/**
          - blob-report/**

    - step: &product-item-test
        size: 2x
        max-time: 120
        caches:
          - npm
        artifacts:
          - playwright-report/**
          - test-results/**
          - allure-results/**
          - blob-report/**

    - step: &opportunity-test
        size: 2x
        max-time: 120
        caches:
          - npm
        artifacts:
          - playwright-report/**
          - test-results/**
          - allure-results/**
          - blob-report/**

# Manual only (Pipelines → Run pipeline). No branches/default = not on push.
pipelines:
  custom:
    rfp:
      - step:
          <<: *rfp-test
          name: Run RFP
          script:
            - export MODULE=rfp
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - npx playwright test regression/rfp --project=chromium --workers=4

    estimates:
      - step:
          <<: *estimates-test
          name: Run Estimates
          script:
            - export MODULE=estimates
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - npx playwright test regression/estimates --project=chromium --workers=1

    product-item:
      - step:
          <<: *product-item-test
          name: Run Product Item
          script:
            - export MODULE=product-item
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - npx playwright test regression/product-item --project=chromium --workers=4

    opportunity:
      - step:
          <<: *opportunity-test
          name: Run Opportunity
          script:
            - export MODULE=opportunity
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - npx playwright test regression/opportunity --project=chromium --workers=4

    regression:
      - step:
          name: Run All Modules
          size: 2x
          max-time: 120
          caches:
            - npm
          script:
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - |
              set +e
              export MODULE=rfp
              npx playwright test regression/rfp --project=chromium --workers=4
              s_rfp=$?
              export MODULE=estimates
              npx playwright test regression/estimates --project=chromium --workers=1
              s_estimates=$?
              export MODULE=product-item
              npx playwright test regression/product-item --project=chromium --workers=4
              s_product=$?
              export MODULE=opportunity
              npx playwright test regression/opportunity --project=chromium --workers=4
              s_opportunity=$?
              mkdir -p blob-all
              find blob-report -name '*.zip' -exec cp {} blob-all/ \;
              npx playwright merge-reports blob-all --reporter html
              test "$s_rfp" -eq 0 && test "$s_estimates" -eq 0 && test "$s_product" -eq 0 && test "$s_opportunity" -eq 0
          artifacts:
            - playwright-report/**
            - test-results/**
            - allure-results/**
            - blob-report/**
